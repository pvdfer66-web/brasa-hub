<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupo — Gruposzap18</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="brand" href="./">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2c1 3-1.5 4-1.5 6.5 0 1.4 1 2.1 2 2.1.9 0 1.6-.6 1.8-1.3.7 1 1.2 2.3 1.2 3.7 0 3.4-2.5 6-6 6s-6.2-2.6-6.2-6c0-4 3.7-6.7 4-9 .3 1 .2 2.1-.3 3 1.4-1 3-2.6 3-5z" fill="#fff2ea"/>
        </svg>
      </span>
      <div>
        GRUPOSZAP18
        <small>Hub de Grupos</small>
      </div>
    </a>
    <div class="top-links">
      <a href="./">Voltar</a>
    </div>
  </header>

  <main>
    <div id="loadingState" style="text-align:center; padding:60px 20px; color:var(--text-mute);">Carregando…</div>

    <div id="notFoundState" hidden style="text-align:center; padding:60px 20px; color:var(--text-mute);">
      <h3 style="font-family:'Bodoni Moda', Georgia, serif; color:var(--text-dim); font-size:1.1rem; margin-bottom:8px;">Grupo não encontrado</h3>
      <p>Esse grupo pode ter sido removido. <a href="./" style="color:var(--ember-bright);">Voltar pro hub</a>.</p>
    </div>

    <article id="groupDetail" class="detail-card" hidden>
      <div class="detail-photo" id="detailPhotoWrap" hidden>
        <img id="detailPhoto" alt="">
      </div>
      <div class="detail-body">
        <div class="detail-top">
          <div class="platform">
            <span class="icon" id="detailIcon"></span>
            <h1 id="detailName" class="detail-name"></h1>
          </div>
          <span class="members" id="detailMembers"></span>
        </div>
        <span class="tag" id="detailTag"></span>
        <p class="detail-desc" id="detailDesc"></p>
        <a class="btn" id="detailJoin">Entrar no grupo</a>
      </div>
    </article>
  </main>

  <footer>
    <div>🔥 <strong>Gruposzap18</strong> — hub comunitário de grupos.</div>
  </footer>
</div>

<script src="grupo.js"></script>
<script src="popunder.js"></script>
</body>
</html>
