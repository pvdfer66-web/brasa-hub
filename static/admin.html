<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Admin — Brasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="brand" href="./">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2c1 3-1.5 4-1.5 6.5 0 1.4 1 2.1 2 2.1.9 0 1.6-.6 1.8-1.3.7 1 1.2 2.3 1.2 3.7 0 3.4-2.5 6-6 6s-6.2-2.6-6.2-6c0-4 3.7-6.7 4-9 .3 1 .2 2.1-.3 3 1.4-1 3-2.6 3-5z" fill="#fff2ea"/>
        </svg>
      </span>
      <div>
        BRASA
        <small>Painel Admin</small>
      </div>
    </a>
    <div class="top-links">
      <a href="index.html">Ver site</a>
      <button type="button" id="logoutBtn" hidden>Sair</button>
    </div>
  </header>

  <div class="admin-shell">

    <!-- ---- login ---- -->
    <section class="login-card" id="loginSection" hidden>
      <h1>Entrar</h1>
      <p>Acesso restrito. Digite a senha de administrador.</p>
      <p class="error-msg" id="loginError" hidden></p>
      <form id="loginForm">
        <div class="field" style="margin-bottom:16px;">
          <label for="loginPassword">Senha</label>
          <input id="loginPassword" type="password" required autocomplete="current-password">
        </div>
        <button class="btn" type="submit" style="width:100%;">Entrar</button>
      </form>
    </section>

    <!-- ---- panel ---- -->
    <section id="panelSection" hidden>
      <div class="panel-head">
        <h1>Grupos</h1>
      </div>

      <div class="add-card">
        <h2>Adicionar grupo</h2>
        <p class="error-msg" id="formError" hidden></p>
        <form id="addForm">
          <div class="form-grid">
            <div class="field span-2">
              <label for="fName">Nome do grupo</label>
              <input id="fName" type="text" required placeholder="Ex: Receitas de Vó">
            </div>
            <div class="field">
              <label for="fPlat">Plataforma</label>
              <select id="fPlat" required>
                <option value="whatsapp">WhatsApp</option>
                <option value="telegram">Telegram</option>
                <option value="discord">Discord</option>
              </select>
            </div>
            <div class="field span-2">
              <label for="fLink">Link de convite</label>
              <input id="fLink" type="url" required placeholder="https://chat.whatsapp.com/...">
            </div>
            <div class="field">
              <label for="fMembers">Membros (aprox.)</label>
              <input id="fMembers" type="number" min="0" step="1" placeholder="0">
            </div>
            <div class="field span-3">
              <label for="fDesc">Descrição curta</label>
              <textarea id="fDesc" required maxlength="160" placeholder="Uma frase sobre o grupo"></textarea>
            </div>
            <div class="field span-3">
              <label for="fPhoto">Foto do grupo (opcional)</label>
              <input id="fPhoto" type="file" accept="image/*">
            </div>
          </div>
          <button class="btn" type="submit" style="margin-top:16px;">Adicionar grupo</button>
        </form>
      </div>

      <div class="admin-list" id="adminList"></div>
      <p id="adminEmpty" style="color:var(--text-mute); text-align:center; padding:20px;" hidden>Nenhum grupo cadastrado ainda.</p>
    </section>

  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
